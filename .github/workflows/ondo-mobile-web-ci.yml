name: ONDO Mobile isolated channel (tests only)
on:
  push:
    branches:
      - "ondo-work/mobile-*"
    paths:
      - "mobile-web/**"
      - ".github/workflows/ondo-mobile-web-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and contract tests (not a Cloudflare live test)
        run: |
          node --check mobile-web/worker.mjs
          node --check mobile-web/worker.test.mjs
          node --test mobile-web/worker.test.mjs
          node --check mobile-web/p3/native_core.mjs
          node --check mobile-web/p3/endpoint_bridge.mjs
          node --check mobile-web/p3/transport.mjs
          node --test mobile-web/p3/transport.test.mjs
          node --check mobile-web/p3/device_client.mjs
          node --test mobile-web/p3/device_client.test.mjs
