name: ONDO JARVIS isolated channel (tests only)
on:
  push:
    branches:
      - "ondo-work/jarvis-*"
    paths:
      - "jarvis-channel/**"
      - ".github/workflows/ondo-jarvis-channel-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and contract tests (not a Cloudflare live test)
        run: |
          node --check jarvis-channel/worker.mjs
          node --check jarvis-channel/worker.test.mjs
          node --test jarvis-channel/worker.test.mjs
