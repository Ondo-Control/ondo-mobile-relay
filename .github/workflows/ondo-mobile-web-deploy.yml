name: Deploy independent ONDO Mobile Worker (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ondo-mobile-web-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ondo-mobile-web
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit Cloudflare connection, without printing credentials
        env:
          CF_ID: ${{ vars.ONDO_MOBILE_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.ONDO_MOBILE_CF_DEPLOY_TOKEN }}
        run: |
          test -n "$CF_ID" || (echo "::error::Cloudflare Account ID variable missing"; exit 1)
          test -n "$CF_TOKEN" || (echo "::error::Private deployment token missing"; exit 1)
      - name: Test the isolated worker first
        run: node --test mobile-web/worker.test.mjs
      - name: Deploy only this new Worker (no ONDO Relay/ONDO Mobile mutation)
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: mobile-web
          apiToken: ${{ secrets.ONDO_MOBILE_CF_DEPLOY_TOKEN }}
          accountId: ${{ vars.ONDO_MOBILE_CF_ACCOUNT_ID }}
          command: deploy
